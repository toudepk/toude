<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TOUDE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Schoolbell&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#F7E8A4;
      color:#5C241C;
      font-family:'Inter',sans-serif;
    }

    nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:25px 8%;
    }

    .logo{
      font-size:38px;
      font-weight:800;
      letter-spacing:2px;
    }

    .hero{
      min-height:80vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:40px;
    }

    h1{
      font-size:75px;
      margin-bottom:20px;
    }

    .tagline{
      font-family:'Schoolbell',cursive;
      font-size:28px;
      margin-bottom:10px;
    }

    .sub{
      font-family:'Schoolbell',cursive;
      font-size:22px;
      margin-bottom:35px;
    }

    button{
      background:#5C241C;
      color:white;
      border:none;
      padding:16px 42px;
      border-radius:50px;
      font-size:18px;
      cursor:pointer;
    }

    .products{
      padding:80px 8%;
    }

    .products h2{
      text-align:center;
      margin-bottom:40px;
      font-size:42px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
    }

    .card{
      background:white;
      border-radius:20px;
      padding:20px;
      text-align:center;
    }

    .image{
      width:100%;
      height:280px;
      background:#dddddd;
      border-radius:15px;
      margin-bottom:15px;
    }

    footer{
      text-align:center;
      padding:50px;
      font-family:'Schoolbell',cursive;
    }

  </style>

</head>

<body>

<nav>

<div class="logo">TOUDE</div>

<div>🩵</div>

</nav>

<section class="hero">

<div>

<h1>TOUDE</h1>

<p class="tagline">
Cool bags for cool people.
</p>

<p class="sub">
A match for your energy.
</p>

<button>SHOP NOW</button>

</div>

</section>

<section class="products">

<h2>OUR DROP</h2>

<div class="grid">

<div class="card">
<div class="image"></div>
<h3>Tote Bag 01</h3>
</div>

<div class="card">
<div class="image"></div>
<h3>Tote Bag 02</h3>
</div>

<div class="card">
<div class="image"></div>
<h3>Tote Bag 03</h3>
</div>

</div>

</section>

<footer>

Instagram • WhatsApp

</footer>

</body>
</html>
